#
# 🔟❎ 'run' TenXTemplate symbol origin selector

unit:

  name: origin

  title: Origin selector

  description: select the source code/binary executable origin of TenXTemplate symbol values
  
  # 'configFolder' specifies a folder containing default configuration files for the settings defined by this unit/module
  configFolder: run/transform/symbol 

  # 'doc' specifies the markdown doc content, only required when generating docs.
  doc: +include $=TenXEnv.get("docGenerate") ? "run/units/transform/symbol/doc.md":""
    
  # 'allowMultiple' is disabled for this unit. Pipeline command line arguments and configuration files
  #  can specify a single value at max for each option defined below.
  allowMultiple: false
      
  # 'optionsGroup' defines a group of named/typed configuration values to pass to a pipeline at startup
  #  via command line arguments (e.g., '> tenx -myA X -myB Y') or YAML launch files (e.g., '> tenx @my.config').
  #  Instances of this group passed are accessible at runtime via TenXEnv.get: https://doc.log10x.com/api/js/#TenXEnv.get

  options:

    - names:
      - symbolSequenceReserved
      description: words that do not count as evidence of a source
      type: list
      required: false
      category: symbol
      defValue:  ["null", "nil", "true","false"]
      doc: |
        Words that do not count as evidence of where a line comes from, such as `true`, `the`, `INFO` or `level`. A match made only of these words cannot pick a source.

        Before the message these words are skipped, and a key from this list is skipped with its value, such as `level=info`. Words of the statement itself stay in the name as written.

        The default lists `null`, `nil`, `true` and `false`. The shipped configuration adds common short words, severity levels and keys such as `timestamp` and `thread`.

    - names:
      - symbolPreambleEnclosures
      description: brackets whose text before the message is skipped
      type: list
      required: false
      category: symbol
      defValue: ["[]", "()"]
      doc: |
        Bracket pairs, each written as its open and close character. Text inside them before the message stays out of the name, such as `main` in `[main] Starting worker`.

        An open bracket with no close in the same field is ignored, such as the `[` of a color code in `\033[0;33mWARN`.

    - names:
      - symbolPreambleAssigners
      description: characters that join a quoted key to its value
      type: list
      required: false
      category: symbol
      defValue: ["=", ":"]
      doc: |
        Characters that join a key to its value when the key or the value is quoted, as in `"level":"info"` or `body: 'Charge request received.'`.

        A [reserved](https://doc.log10x.com/run/transform/symbol/#symbolsequencereserved) key and its value stay out of the name, and the name starts inside a [message key](https://doc.log10x.com/run/transform/symbol/#symbolpreamblemessagekeys)'s value. Without quotes, `:` joins nothing, so `Error: 13 INTERNAL` and `INFO:root:Starting` keep their words.

    - names:
      - symbolPreambleBareAssigners
      description: characters that also join an unquoted key to its value
      type: list
      required: false
      category: symbol
      defValue: ["="]
      doc: |
        Characters that join a key to its value without quotes, as logfmt writes them: `level=info`, `logger=cleanup`. They also work with quotes.

    - names:
      - symbolPreambleJoiners
      description: separators that chain words into one name
      type: list
      required: false
      category: symbol
      defValue: [".", "::"]
      doc: |
        Separators that chain words into one name without spaces, such as `org.apache.kafka.log.LocalLog` or `cart.cartstore.ValkeyCartStore`, usually a logger, class or file name.

        Such a name stays in an event's name, since it often tells two statements apart. A line of a multi-line event that holds only such names does not name the event, see [symbolGroupLead](https://doc.log10x.com/run/transform/symbol/#symbolgrouplead).

    - names:
      - symbolPreambleMessageKeys
      description: keys whose value holds the message
      type: list
      required: false
      category: symbol
      defValue: ["msg", "message", "body"]
      doc: |
        Keys whose value holds the message. The name starts at the value's first word outside brackets, such as `starting` in `msg=starting` or `Subchannel` in `"msg":"[core][Channel #1] Subchannel created"`.

        In a record that opens with `{`, reading starts at the first of these keys that has a value. A message key with no value stays out of the name.

    - names:
      - symbolGroupLead
      description: line of a multi-line event that names it
      type: string
      required: false
      category: symbol
      defValue: firstWithMessage
      doc: |
        Which line of a multi-line event names it. The name, origin and skeleton all come from that line.

        - `firstWithMessage`: the first line that holds message text. A line of only brackets, reserved keys and [joined](https://doc.log10x.com/run/transform/symbol/#symbolpreamblejoiners) names is passed over. The .NET console logger writes `info: cart.cartstore.ValkeyCartStore[0]` and then the message, so the second line names the event. A stack trace is named by its exception line.
        - `head`: always the first line.

    - names:
      - symbolMaxOrigins
      description: most places in code compared for one phrase
      type: number
      required: false
      category: symbol
      doc: |
        The most places in code to compare for one phrase. A phrase such as `could not connect to` can appear in many files. The first ones in library order, by file name and then by unit name, are compared, so the same library picks the same origin on every node.
      defValue: 64

    - names:
      - symbolDebugOrigins
      description: source files to log origin choices for
      type: list
      category: debug
      required: false
      doc: |
        Source files in the symbol library, such as `foo.java`, for which to log how they take part in picking an event's origin. Set `*` for all files.

    - names:
       - symbolDebugSymbols
      description: words to log origin choices for
      type: list
      required: false
      category: debug
      doc: |
        Words of a line, such as `MyClass` or `Could not connect to`, for which to log how their origin is picked. Set `*` for all of them.

    - names:
       - symbolDebugLoggerName
      description: logger for debug output
      type: string
      required: false
      category: debug
      doc: |
        The log4j logger that [symbolDebugOrigins](https://doc.log10x.com/run/transform/symbol/#symboldebugorigins) and [symbolDebugSymbols](https://doc.log10x.com/run/transform/symbol/#symboldebugsymbols) write to.
      defValue: "[consoleOut](https://github.com/log-10x/config/blob/main/log4j2.yaml#L66)"
