#
# 🔟❎ 'run' rate receiver module

module:

  name: rateReceiver

  title: rate receiver

  description: Filter TenXObjects from output using either local per-node budget sampling or a declarative field-set keyed mute file.

  # 'configFolder' specifies a folder containing default configuration files for the settings defined by this unit/module
  configFolder: run/receive/rate

  # 'doc' specifies the markdown doc content, only required when generating docs.
  doc: +include $=TenXEnv.get("docGenerate") ? "run/modules/receive/rate/doc.md":""

  # 'allowMultiple' is disabled for this module. Pipeline command line arguments and configuration files
  #  can specify a single value at max for each option defined below.
  allowMultiple: false

  # 'optionsGroup' defines a group of named/typed configuration values to pass to a pipeline at startup
  #  via command line arguments (e.g., '> tenx -myA X -myB Y') or YAML launch files (e.g., '> tenx @my.config').
  #  Instances of this group passed are accessible at runtime via TenXEnv.get: https://doc.log10x.com/api/js/#TenXEnv.get
  options:

    - names:
      - rateReceiverFieldNames
      description: list of TenXObject fields to identify rate counter buckets
      type: list
      required: false
      doc: |
        defines the list of TenXObject field names extracted to identify which rate counter bucket an event belongs to.
        The list usually contains the pattern field the [message enrichment](https://doc.log10x.com/run/initialize/message/) module writes,
        named by `symbolMessageField`: `message_pattern` in the shipped configuration, `symbolMessage` at that option's default.
        It can include additional fields like [GeoIP](https://doc.log10x.com/run/initialize/geoIP/), [HTTP code](https://doc.log10x.com/run/initialize/httpCode/), [k8s container name](https://doc.log10x.com/run/initialize/k8s/), or custom enrichments for multi-dimensional rate tracking.

        **Common Use Cases:**

        **Single-app receiving (per event type):**
        ```yaml
        rateReceiverFieldNames:
          - message_pattern
        ```

        **Multi-dimensional tracking (event type + geography + HTTP status):**
        ```yaml
        rateReceiverFieldNames:
          - message_pattern
          - country
          - httpCode
        ```

        **Multi-app receiving in Kubernetes:**

        *Option A: Cap total spend per app (all event types combined):*
        ```yaml
        rateReceiverFieldNames:
          - container  # Aggregates all event types for each app
        ```
        Each app's total spend (across all event types and pods) gets one cap. Simple but loses event-type intelligence.

        *Option B: Cap spend per event type per app:*
        ```yaml
        rateReceiverFieldNames:
          - message_pattern  # Event type
          - container      # App identifier (same across all pods)
        ```
        Each (event type × app) combo gets its own cap. Provides fairness within apps but allows apps with many event types to potentially exceed one total cap.

        The container is configured separately via `rateReceiverContainerField` (it scopes the
        share denominator), so `fieldNames` identifies only the log pattern itself.
      defValue: [symbolMessage]

    - names:
      - rateReceiverContainerField
      description: field whose value scopes the per-container share denominator
      type: string
      required: false
      doc: |
        names the field whose value scopes the share denominator (the per-container total).
        A pattern's share is measured against the total volume of the container it belongs to,
        so the cap is enforced per `(pattern, container)`.

        Defaults to the [k8s container name](https://doc.log10x.com/run/initialize/k8s/), which is
        stable across pod replicas, scaling from 1 to 10 pods does not bypass the cap, and a
        sidecar never consumes the application container's allowance. Use `container`, never `pod`.

        When the field is absent on an event (non-k8s input, or no k8s extractor configured), the
        regulator falls back to a single node-wide bucket and enforces the cap per pattern across
        the node.
      defValue: ""

    - names:
      - rateReceiverResetIntervalMs
      description: reset interval for rate counters in milliseconds
      type: number
      required: false
      doc: |
        defines the window in milliseconds over which a pattern's recent share is measured. The
        counters reset every interval, so share reflects recent volume rather than all-time totals.

        Shorter windows (e.g., 1 minute) are more reactive but noisier; longer windows are smoother but
        slower to adapt. The default of 4 minutes balances the two.

        **Validation:** Must be at least 60000 milliseconds (1 minute). The engine caps counter reset
        intervals at 255 seconds, so the effective maximum window is ~4.25 minutes, values above that
        are clamped.
      defValue: 240000

    - names:
      - rateReceiverMinRetentionThreshold
      description: default retention floor for severity levels not listed in severityFloors
      type: number
      required: false
      doc: |
        defines the retention floor (0.0 to 1.0) used for any severity level not present in
        `rateReceiverSeverityFloors`. Ensures a pattern over its cap still retains at least this
        fraction of events whose level has no explicit floor, preventing complete data loss.

        **Validation:** Must be greater than 0.01.
      defValue: 0.1

    - names:
      - rateReceiverSeverityFloors
      description: minimum retention per severity level, applied as an absolute floor
      type: list
      required: false
      doc: |
        defines a map of [severity levels](https://doc.log10x.com/run/initialize/level/) to a minimum
        retention fraction. The floor is **absolute** (not a multiplier) and **beats the share cap**:
        even a pattern over its cap keeps at least this fraction of each level, so high-severity
        events are never fully suppressed.

        The floor also applies under a mute-file entry, so a `0.0` mute never silences ERROR/FATAL.

        Floor-map keys must match the level vocabulary emitted by the level enrichment. Any level not
        listed uses `rateReceiverMinRetentionThreshold`.

        For example:

        ``` yaml
        severityFloors:
          - TRACE=0.1
          - DEBUG=0.1
          - INFO=0.1
          - WARN=0.3
          - ERROR=0.5
          - FATAL=0.5
        ```

    - names:
      - rateReceiverLookupFile
      description: declarative mute file keyed by field-set
      type: string
      required: false
      doc: |
        defines the path to a declarative **mute file** that caps specific log patterns by
        the joined field-set defined in `rateReceiverFieldNames` (e.g. `message_pattern`,
        `container`, `httpCode`). The key format is the same one the local receiver uses
        for per-node counters.

        When this option is set, the mute file **composes with** the regulator rather than
        replacing it: a listed, active pattern is decided by its file entry (the human
        declaration wins, and the regulator is skipped for that event), while every other
        pattern is handled by the regulator's cap.

        **File format** (CSV; header row + one comma-separated entry per row):

        ```
        fieldSet,value
        <fieldSetKey>,<sampleRate>:<untilEpochSec>[:<reason>]
        ```

        - `fieldSetKey`, the joined values of the fields named in `rateReceiverFieldNames`,
          separated by `_`. With `rateReceiverFieldNames: [message_pattern]` the key is just
          the pattern (e.g. `Error_syncing_pod`). With `[message_pattern, container]`
          the key is `message_pattern_container` (e.g. `heartbeat_debug_frontend`).
        - `sampleRate`, probability in `[0, 1.0]` that a matching event is retained.
          `0` = full mute; `0.1` = keep 10%; `1.0` = no-op.
        - `untilEpochSec`, mute expires at this Unix epoch (seconds). Past that, the
          entry becomes a no-op until someone edits or removes it. Self-healing by design.
        - `reason`, optional free-text string for audit. Not used at runtime. Must not
          contain commas (would break CSV parsing).

        **Example** (with `rateReceiverFieldNames: [message_pattern]`):

        ```
        fieldSet,value
        Error_syncing_pod,0.10:1744848000:pod error spam OPS-4821
        heartbeat_debug,0:1744416000:k8s liveness 200s
        jwt_validated,0.25:1744502400:auth flood after deploy
        ```

        The file is hot-reloaded on in-place writes (the gitops pattern); a Kubernetes
        `ConfigMap` mount won't reload because the CM swap is a symlink rename, not an
        in-place write.

        **Why this shape:**

        - **Field-set keyed**, not regex keyed → mute keys are the exact identifiers the
          Reporter attributes cost to (same `rateReceiverFieldNames` on both sides), so a
          "top spender" in the Reporter maps 1:1 to a mute entry.
        - **Git-friendly**: the file is a human-readable declaration that can live in a
          config repo, reviewed via PR, `git blame`-d for who/why.
        - **Self-healing**: every mute has an explicit expiry, so forgotten entries
          eventually stop filtering instead of silently dropping production data forever.
        - **AI-editable**: an operator can ask an assistant (e.g., Claude Code via the
          Log10x MCP) to "mute `Error_syncing_pod` for 24 hours at 10%", the assistant
          reads the Reporter's cost attribution, appends the entry, and opens a PR. The
          mute file is the interface.

        **Severity floor still applies.** Even a `0.0` mute will retain high-severity
        events at their `rateReceiverSeverityFloors` fraction. This prevents a poorly-scoped
        mute from silencing ERROR/FATAL traffic.

        When `rateReceiverLookupFile` is **unset**, the regulator runs alone on every pattern.
      defValue: ""

    - names:
      - rateReceiverLookupRetain
      description: Retention period for the lookup file containing global event type rates
      type: number
      required: false
      doc: |
        Defines the retention period for the lookup file containing global event type frequency data.

        If the file's last modified time is older than this period, the lookup is considered stale, and local counter rates are used.
        Used to make sampling decisions based on cluster-wide event patterns.

        **Validation:** Must be greater than 60000 milliseconds.
      defValue: 300000

    - names:
      - rateReceiverActionLookupFile
      description: declarative per-service action file, keyed by the `rateReceiverContainerField` value; decides the disposition of each service's regulator excess
      type: string
      required: false
      doc: |
        Defines the path to a declarative **per-service action file** (sibling to the cap file).
        Each entry assigns the disposition of a service's regulator-identified excess: `pass`
        (default), `offload` (to customer S3), `tier_down` (analyzer cheap tier), `compact` (lossless
        encode), `sample`, or `drop`. The byte cap (`rateReceiverCapLookupFile`) still decides where the
        excess starts; the action only decides what happens to it. A capped service with no row
        passes, and a cap file with no actions file loads an empty table: a cap alone never loses a
        line. Read by the cap-variant regulator classes, which call `route(action)` at the
        over-budget decision point.

        **File format** (CSV; header row + one comma-separated entry per row):

        ```
        container,action
        <container>,<action>[:<untilEpochSec>][:<reason>]
        ```

        - `container`, value of `rateReceiverContainerField` (the k8s container = the service).
        - `action`, one of `drop` / `offload` / `tier_down` / `compact` / `sample` / `pass`.
        - `untilEpochSec`, optional Unix-epoch (seconds) expiry; past it the entry is a no-op.
        - `reason`, optional free-text for audit. Must not contain commas (would break CSV parsing).

        Intended to be managed via GitOps + the `log10x_configure_engine` MCP tool, which derives
        per-service actions from the per-pattern action plan it already computes.

    - names:
      - rateReceiverDefaultAction
      description: disposition applied to a capped container's excess when the action file has no row for it
      type: string
      required: false
      doc: |
        names the route applied at the over-budget decision point for a container that has no
        entry in `rateReceiverActionLookupFile`: one of `pass`, `offload`, `tier_down`, `compact`,
        `sample`, `drop`. A row in the action file still wins for the containers it names.
      defValue: pass

    - names:
      - rateReceiverCapLookupFile
      description: declarative per-container byte cap file, keyed by the `rateReceiverContainerField` value
      type: string
      required: false
      doc: |
        defines the path to a declarative **per-container cap file**. Each entry assigns a byte cap
        to a specific container (the value of `rateReceiverContainerField`, which defaults to the k8s
        container name). The file's cap wins per-event over `rateReceiverAbsoluteCap`: listed
        containers get the file's cap, unlisted containers fall back to the fleet-wide cap (or to
        no cap, if `rateReceiverAbsoluteCap` is `0`).

        **File format** (CSV; header row + one comma-separated entry per row):

        ```
        container,cap
        <container>,<bytes>[:<untilEpochSec>][:<reason>]
        ```

        - `container`, value of `rateReceiverContainerField` for the events to cap. In k8s this is
          the k8s container name, stable across pod replicas.
        - `bytes`, integer byte cap per pattern per container per window. `0` exempts the
          container from the absolute cap entirely (the over-cap branch is skipped for it).
        - `untilEpochSec`, optional Unix-epoch (seconds) expiry. Past that, the entry becomes a
          no-op and the fallback cap applies.
        - `reason`, optional free-text string for audit. Not used at runtime. Must not contain
          commas (would break CSV parsing).

        **Example**:

        ```
        container,cap
        payment-service,4194304:1735689600:annual budget protection PAY-101
        auth-service,2097152
        istio-proxy,0:1735689600:exempt platform sidecar PLAT-42
        ```

        **Why this shape**:

        - **Container-keyed**, matching the regulator's container axis. The file's key is the same
          value the regulator's counters are bucketed by, so listed caps map 1:1 to counters without
          translation.
        - **Git-friendly**: a human-readable declaration that lives in a config repo, reviewed via
          PR, `git blame`-d for who/why.
        - **Self-healing**: every entry can carry an explicit expiry, so forgotten caps eventually
          stop filtering instead of silently dropping production data forever.
        - **AI-editable**: an operator can ask an assistant (e.g., Claude Code via the Log10x MCP
          `configure_engine` tool) to derive a cap from a target percent or a monthly dollar budget, append the
          entry, and open a PR. The cap file is the interface.

        **Severity floor still applies.** Even at a tight cap the regulator's `rateReceiverSeverityFloors`
        retain ERROR/CRITICAL events at their floor fraction, so a tight cap never fully silences
        high-severity traffic.

        When `rateReceiverCapLookupFile` is **unset**, every container falls back to
        `rateReceiverAbsoluteCap` (which itself defaults to `0` = disabled).

        The file is hot-reloaded on in-place writes (the gitops pattern); a Kubernetes
        `ConfigMap` mount won't reload because the CM swap is a symlink rename, not an
        in-place write.
      defValue: ""

    - names:
      - rateReceiverCapLookupRetain
      description: retention period for the per-container cap file before it is considered stale
      type: number
      required: false
      doc: |
        Defines the retention period (in milliseconds) for the cap file (`rateReceiverCapLookupFile`).
        If the file's last modified time is older than this period, a warning is logged. The cap
        entries continue to apply; the staleness check is advisory so operators notice when an
        automated tooling pipeline has stopped updating the file.

        **Validation:** Must be greater than 60000 milliseconds.
      defValue: 300000

    - names:
      - rateReceiverConfigGenerationFile
      description: optional config-generation file whose `generation` value is stamped as the `tenx_config_version` metric label
      type: string
      required: false
      doc: |
        defines the path to the **config-generation file** the MCP control plane
        (`log10x_configure_engine`) writes as a SIBLING of the cap file in the cap ConfigMap. It is a
        two-column CSV (`key,value`) with one row, `generation,<hash-of-caps>`, where the generation
        is a deterministic hash of the cap policy. The receiver's config-generation object reads that
        value and stamps it on every event as `tenx_config_version` (declared in this module's
        `enrichmentFields`), so the running engine advertises which config generation it loaded. The MCP
        then verifies the policy it wrote is actually live by comparing the label to `hash(current caps)`,
        the config-generation closed loop.

        **Opt-in, and decoupled from caps.** Unset by default (`""`); the `tenx_config_version` stamp is
        emitted only when this points at a file. A receiver running the rate regulator WITHOUT the MCP
        closed loop (e.g. GitOps-managed caps) leaves it unset and emits no `tenx_config_version` label.
        It never depends on the file existing, so it can't fail init on a missing file. Set it only where
        the MCP writes the file (via the `CONFIG_GENERATION_FILE` env or `configGeneration.file` in
        config.yaml).

        **File format** (CSV; header row + one row):

        ```
        key,value
        generation,<12-char hash of caps.csv>
        ```

        Hot-reloaded like the cap file, so a new generation written by `configure_engine` goes live
        without an engine restart. This is exactly what the verifier observes as the stale -> live
        transition.
      defValue: ""

    - names:
      - rateReceiverWarmupMs
      description: per-container grace period before this regulator instance starts capping
      type: number
      required: false
      doc: |
        defines a per-container grace period in milliseconds. A container is left unregulated for this
        long after this regulator instance first sees its events. The default is 5 minutes.

        Why it exists: the regulator's per-pattern sample counts start empty. Without a few minutes of
        accumulation, a low-volume pattern can look like the dominant one purely because of ordering.
        The warmup defers cap decisions until there are enough samples to tell a noisy pattern from a
        quiet one with confidence. This is a **delay only**; no learned baseline is built, and the
        only state that survives is the container's first-seen timestamp.

        "First sees" is per regulator instance, not per container birth. A container that has been
        running for hours but whose events have only just started flowing through this regulator
        (e.g. after a regulator restart or forwarder reconnect) restarts the warmup window. On a
        daemonset rolling restart the cap is therefore disabled for `warmupMs` per node as it cycles.

        Lower the value for fast-starting apps that should be capped sooner after a restart. Raise it
        for slow-ramping JVMs or workloads with long init phases. Patterns that are legitimately
        dominant in steady state belong on the mute file, not in a longer warmup.
      defValue: 300000

    - names:
      - rateReceiverBaselineCount
      description: events per pattern kept each window regardless of share
      type: number
      required: false
      doc: |
        defines how many events of each `(pattern, container)` are always kept per window, regardless
        of share, so even a heavily-capped pattern leaves a small forensic sample to inspect during an
        incident.
      defValue: 5

    - names:
      - rateReceiverAbsoluteCap
      description: fleet-wide byte cap per pattern per container per window; `0` (default) disables the cap unless overridden per-container via `rateReceiverCapLookupFile`
      type: number
      required: false
      doc: |
        defines a **fleet-wide** byte cap: the byte budget for a single pattern (a unique combination
        of `rateReceiverFieldNames` values) per container within the current window
        (`rateReceiverResetIntervalMs`), past which the regulator engages. Applies to every container
        the regulator sees, unless that container has its own entry in `rateReceiverCapLookupFile`,
        which wins per-event.

        At or below the resolved cap the pattern is kept untouched. Above it, the regulator engages:
        if the pattern is also above `rateReceiverMinSharePercent` (the sanity guard), the event is
        sampled at the severity floor probability.

        **`0` (the default) disables the fleet-wide cap.** With no fleet-wide cap and no per-container
        entry in `rateReceiverCapLookupFile`, the regulator's over-cap branch never engages for that
        container. Protection is strictly opt-in. Three configurations are first-class:

        - **Per-container only**: set `rateReceiverCapLookupFile`. Listed containers get their cap;
          unlisted containers are unregulated by the absolute cap. Most selective.
        - **Fleet-wide only**: set `rateReceiverAbsoluteCap` to a positive integer. Applies to every
          container.
        - **Both**: per-container entries override the fleet-wide cap; unlisted containers fall back
          to the fleet-wide cap (safety floor).

        **Example:** 10485760 (10 MB) means the regulator engages for a pattern once it has spent
        10 MB in a container within the 5-minute window.

        **The cap is not a hard bound.** The severity floor check runs after the cap check, so above
        the cap a flood still passes at the floor rate (ERROR and CRITICAL half, WARN three tenths,
        everything else a tenth). The worst case for one pattern in one container per window is the
        cap plus the floor share of everything above it.
      defValue: 0

    - names:
      - rateReceiverMinSharePercent
      description: minimum share of container volume below which a pattern is exempt from sampling
      type: number
      required: false
      doc: |
        defines the share-of-container sanity guard (0.0 to 1.0): if a pattern is above the absolute
        cap BUT below this share of its container's total volume, the regulator skips it. The pattern
        is part of a legitimately high-volume container (busy API gateway, access log workload), not
        a noisy outlier.

        Share is `(pattern bytes + event) / (container bytes + event)` over the current window.

        **Example:** 0.05 means a pattern above the absolute cap is still retained if it represents
        less than 5% of its container's total volume. Prevents false positives on naturally chatty
        containers.
      defValue: 0.05

    - names:
      - rateReceiverIngestionCostPerGB
      description: vendor ingestion cost per GB in USD, for rendering savings in dollars
      type: number
      required: false
      doc: |
        defines the cost per GB charged by your observability vendor for log ingestion. Used **only**
        to render savings metrics in dollars (dropped bytes × cost per GB); it does **not** affect the
        keep/drop decision, which is driven by the byte cap.

        **Common vendor pricing (2025):**
        - **Splunk Cloud**: ~$1.50/GB (varies by contract, SKU)
        - **Datadog Logs**: ~$0.10-$0.25/GB (depends on tier: standard, flex, online archives)
        - **Elastic Cloud**: ~$0.109/GB (standard logging tier)
        - **New Relic**: ~$0.30/GB (Data Plus)
        - **Sumo Logic**: ~$1.50/GB (depends on plan)
        - **AWS CloudWatch Logs**: ~$0.50/GB ingestion + $0.03/GB storage
        - **Azure Monitor Logs**: ~$2.30/GB Analytics, $0.50/GB Basic, $0.05/GB Auxiliary (+ per-GB query fee)
      defValue: 1.5