# 🔟❎ 'run' rate receiver settings

# Set the 10x pipeline to 'run'
tenx: run

# Exactly one regulator-decision class is loaded per (mute, cap) cartesian
# combination, dispatched by the 4-way ternary below. The four classes have
# mutually-exclusive `shouldLoad` gates:
#   - rateReceiverObject             (rate-object-local.js):     !mute && !cap  -> shouldRetainEvent()
#   - rateReceiverCapObject          (rate-object-cap.js):       !mute &&  cap  -> shouldRetainEventWithCap()
#   - rateReceiverLookupObject       (rate-object-lookup.js):     mute && !cap  -> shouldRetainEventWithMute()
#   - rateReceiverLookupCapObject    (rate-object-lookup-cap.js): mute &&  cap  -> shouldRetainEventWithMuteAndCap()
#
# Each class duplicates the regulator algorithm with the lookups it needs
# inlined. The cartesian split exists because TenX DSL parse-validates
# `TenXLookup.get` against runtime-registered tables -- a class that
# references a lookup may-not-be-loaded fails engine init. Cross-class
# getter composition was attempted first and verified broken on the demo
# cluster: the regulator class could not read a getter declared on a
# separate cap-class. Inlining + cartesian shouldLoad is the working pattern.
#
# Method names live in a GLOBAL namespace across all parsed classes, so the
# four getters have four distinct names. The single groupFilters slot
# dispatches the right one per event; the other three classes have
# shouldLoad=false and their methods are never invoked.
#
# Outer quotes on the list entry are REQUIRED -- the inner `: "..."` of the
# ternary is YAML mapping syntax otherwise.
groupFilters:
  - '$=yield (TenXEnv.get("rateReceiverLookupFile") && TenXEnv.get("rateReceiverCapLookupFile")) ? "shouldRetainEventWithMuteAndCap()" : TenXEnv.get("rateReceiverLookupFile") ? "shouldRetainEventWithMute()" : TenXEnv.get("rateReceiverCapLookupFile") ? "shouldRetainEventWithCap()" : "shouldRetainEvent()"'

# ============================ Metric Dimension ===============================
#
# Append `routeState` to the global enrichmentFields (same additive mechanism as
# run/modules/initialize/k8s & level settings.yaml). Each pattern's all_events /
# emitted_events series then carries a `routeState` label, bifurcating it into
# the regulator-marked events (routeState="drop") vs the kept events ("pass"). This makes per-service /
# per-pattern attribution of reduction a DIRECT query (all_events{routeState="drop"})
# instead of an all-minus-emitted subtraction, with no extra aggregator.
#
# `routeState` is a first-class field accessor (EventRouteStateFieldAccessor),
# get-by-name and groupable exactly like any enrichment field. The value set is
# the small fixed route-name vocabulary (today "drop"/"pass"), so it at most
# doubles series for partially regulated patterns; with no cap it is uniformly
# "pass" (harmless).
include:
  - run/modules/initialize/module.yaml

enrichmentFields:
  # The aggregator groups raw events by the intrinsic `routeState` (correct at
  # event time), but a TenXSummary instance is itself never dropped, so reading
  # the intrinsic on the summary at metric-output time returns "pass" for every
  # row. The `l1e_` prefix forces the resolver to read the value ENCODED INTO
  # the summary (the grouped bucket value) instead of the summary's intrinsic.
  # So: at event time isSummary is false -> intrinsic routeState (name);
  # at output time isSummary is true -> l1e_routeState (the encoded bucket value).
  - 'routeState=isSummary?l1e_routeState:routeState'
  # Config-version label. The receiver's config-generation object
  # (run/receive/rate/config-generation-object.js) reads the `config-generation`
  # lookup (config-generation.csv, which the control-plane writer -- the MCP --
  # drops into the cap ConfigMap alongside caps.csv) and stamps its value as
  # `tenx_config_version`, so the running engine advertises which config
  # generation it loaded and the writer can verify the policy it wrote is live.
  # Unlike routeState, this is NOT an intrinsic field accessor -- it's a plain
  # reflected field, so its name already resolves to the encoded bucket value on
  # the summary; no isSummary/l1e_ override is needed. Low cardinality: one value
  # per running config in steady state, at most one extra on a rollover.
  #
  # Conditional on the `rateReceiverConfigGenerationFile` option (declared in
  # module.yaml; set via `configGeneration.file` / the `CONFIG_GENERATION_FILE`
  # env in config.yaml, pointing at the config-generation.csv path). The stamp
  # object is gated on the same option, so the field is declared exactly when it
  # can be set -- no orphan dimension on receivers that don't run the closed
  # loop, and a bare local 'run' (option unset) carries it nowhere. Outer quotes
  # required (the ternary's inner `: "..."` is YAML mapping syntax otherwise).
  - '$=yield TenXEnv.get("rateReceiverConfigGenerationFile") ? "tenx_config_version" : ""'
