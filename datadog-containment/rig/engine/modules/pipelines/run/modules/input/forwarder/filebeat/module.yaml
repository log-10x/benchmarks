#
# 🔟❎ 'run' Filebeat module
#
# Filebeat integration via subprocess piping + a return Unix-domain socket.
# Filebeat runs as a child of the 10x sidecar (filebeat -e 2>&1 | tenx ...);
# events get marked + emitted to stdout by a script processor, optionally
# filtered/compacted by the engine, and looped back to Filebeat over the
# socket. Filebeat is then free to ship to its real output(s).

module:

  name: filebeat

  title: Filebeat

  description: report, receive, and optimize events collected by Filebeat forwarders

  # 'configFolder' specifies a folder containing default configuration files
  # for the settings defined by this unit/module
  configFolder: run/input/forwarder/filebeat

  doc: +include $=TenXEnv.get("docGenerate") ? "run/modules/input/forwarder/filebeat/doc.md":""

  allowMultiple: false

  options:

    # ============================== Output ==================================

    - names:
        - filebeatOutputFields
      description: list of TenXObject field names to include alongside the main event in output
      type: list
      required: false
      category: output
      defValue: []
      doc: |
        specifies TenXObject field names to emit alongside the main event text
        when writing back to the Filebeat forwarder. When empty (default), only
        the main event field is written. Example fields: level, group, symbolMessage.

    - names:
        - filebeatOutputEncodeType
      description: "output format when outputFields are set. Possible values: [json, delimited]"
      type: string
      required: false
      category: output
      defValue: delimited
      doc: |
        specifies how the combined output (main event field plus outputFields)
        is encoded when writing back to the Filebeat forwarder. Possible values:
        - **json**: formats all fields as a JSON object
        - **delimited**: formats field values separated by the output delimiter
        Only takes effect when filebeatOutputFields is set.

    # =========== Parsed from filebeat.yml at startup (engine-internal) ======
    # These are populated by the `match` source-extractors in stream.yaml:
    # filebeatConfigPath/filebeatLogsPath come from Filebeat's startup banner
    # on stdin; the logging.* values come from re-reading filebeat.yml. They
    # feed the filebeatRollingFile / filebeatStderr / filebeatSyslog appenders
    # configured in log4j2.yaml, so the engine can emit Filebeat's own log
    # messages to the same destinations Filebeat would have used.

    - names:
        - filebeatConfigPath
      description: configuration file path
      type: file
      required: false
      category: filebeatLog
      doc: |
        path containing Filebeat configuration files

    - names:
        - filebeatLogsPath
      description: log file path
      type: file
      required: false
      category: filebeatLog
      doc: |
        path containing Filebeat log files

    - names:
        - filebeatLoggingToFiles
      description: control log file rotation
      type: boolean
      required: false
      category: filebeatLog
      doc: |
        sets Filebeat logging to rotating files.
        Set logging.to_files to false to disable logging to files.

    - names:
        - filebeatLoggingToStderr
      description: Filebeat logging to stderr
      type: boolean
      required: false
      category: filebeatLog
      doc: |
        Filebeat logging to stderr.
        Set logging.to_stderr to false to disable logging to stderr.

    - names:
        - filebeatLoggingToSyslog
      description: Filebeat logging to syslog
      type: boolean
      required: false
      category: filebeatLog
      doc: |
        Filebeat logging to syslog.
        Set logging.to_syslog to false to disable logging to syslog.

    - names:
        - filebeatName
      description: Filebeat log name
      type: file
      required: false
      category: filebeatLog
      doc: |
        name of the Filebeat files where the logs are written to

    - names:
        - filebeatPath
      description: output path for Filebeat logs
      type: file
      required: false
      category: filebeatLog
      doc: |
        configures the path where the Filebeat logs are written

    - names:
        - filebeatInterval
      description: enable Filebeat log file rotation
      type: String
      required: false
      category: filebeatLog
      doc: |
        enable Filebeat log file rotation on time intervals in addition to the size-based rotation

    - names:
        - filebeatRotateEveryBytes
      description: Filebeat log file size limit
      type: number
      required: false
      category: filebeatLog
      doc: |
        configure Filebeat log file size limit.
        If limit is reached, log file will be automatically rotated

    - names:
        - filebeatRotateOnStartup
      description: rotate existing Filebeat logs upon startup
      type: boolean
      required: false
      category: filebeatLog
      doc: |
        rotate existing Filebeat logs on startup rather than appending them to the existing file

    - names:
        - filebeatPermissions
      description: log file permissions mask
      type: string
      required: false
      category: filebeatLog
      doc: |
        POSIX permissions mask to apply when rotating Filebeat log files

    - names:
        - filebeatKeepFiles
      description: number of rotated Filebeat log files to keep
      type: number
      required: false
      category: filebeatLog
      doc: |
        number of rotated Filebeat log files to keep.
        Oldest files will be deleted first

    # ============================== Internal ================================

    - names:
        - rawOutputUnixSocketAddress
      description: internal
      type: string
      required: false
      category: internal
      doc: |
        internal variable used to load socket address to be used in multiple encoders

    - names:
        - filebeatInputReady
      description: internal
      type: string
      required: false
      category: internal
      doc: |
        an internal marker used to indicate Filebeat input ready
