# 🔟❎ 'run' Fluent Bit input + output streams
#
# Listens for events from Fluent Bit's `forward` output plugin and
# sends processed events back to a paired `forward` input, both legs
# over the Fluent Forward protocol (TCP or Unix domain socket).

tenx: run

runtimeAttributes:
  - fwd_input:fluentbit

include:
  - run/modules/output/event/forward

# ============================== Extractor ====================================

extractor:
  - name: fluentbit
    type: json
    actions:
      # Capture the configurable message field as the event's text
      - $=yield "captureFirst:" + TenXEnv.get("fluentbitInputMessageField", "log")
      # The Forward decoder surfaces the wire tag as a `tag` field for the
      # `sourcePattern` to capture below; remove it from the record body so
      # the event going back out to Fluent Bit has the same shape as the one
      # that arrived.
      - drop:tag

# ============================== Input ========================================

input:

  - type: stream
    name: fluentbit

    # Fluent Forward protocol decoder (msgpack over TCP or Unix socket)
    path: com.log10x.ext.edge.input.forward.ForwardProtocolInputStream

    # Apply the Fluent Bit extractor above; add the k8s extractor automatically
    # when the Receiver app sets `k8sExtractorName: fluentK8s`.
    extractors:
      - fluentbit
      - "$=yield TenXEnv.get(\"k8sExtractorName\") ? \"fluentK8s\" : \"\""

    # Use the wire-level Fluent Bit tag as the event's source.
    sourcePattern: \"tag\":\"(.*?)\"

    args:
      # Listen on this TCP port
      - port
      - $=yield TenXEnv.get("fluentbitInputPort", "24224")
      # Pass path if it exists, which will set it instead of the port
      - '$=yield TenXEnv.get("fluentbitInputPath", "") ? "path" : ""'
      - $=yield TenXEnv.get("fluentbitInputPath", "")

    # Backpressure ceiling, Log10x stops draining the Forward socket once
    # this many bytes have arrived in `intervalBytesDuration`, signalling
    # Fluent Bit to buffer instead of overwhelming the pipeline.
    backpressure:
      intervalBytesLimit: $=parseBytes("2MB")
      intervalBytesDuration: $=parseDuration("1s")

# ============================== Output =======================================

outputForward:

  - hostAddress: $=yield TenXEnv.get("fluentbitOutputHost", "127.0.0.1")
    hostPort: $=yield TenXEnv.get("fluentbitOutputPort", "24225")
    address: $=yield TenXEnv.get("fluentbitOutputPath")

    fields:
      # Carries the whole Fluent Bit record in receive mode and an encoded
      # form in compact mode. Picked automatically based on the Receiver
      # app's mode (`receiverOptimize`, `compactReceiverLookupFile`,
      # `symbolMessageHashField`).
      - $?outputEncodeField=fullText

    # Emit each top-level field of the rendered record as its own field on
    # the outgoing Forward event, so the record structure of the original
    # Fluent Bit event survives the round trip.
    encodeType: $?fluentbitOutputEncodeType=delimited

    writeTemplates: $?outputWriteTemplates=false
