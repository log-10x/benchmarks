# ─────────────────────────────────────────────────────────────────────────────
# Log10x Logstash sidecar — destinations pipeline
# ─────────────────────────────────────────────────────────────────────────────
#
# Receives processed events back from the Log10x sidecar on `:5045` and
# routes them to your real destinations.
#
# Keep this pipeline filter-free — add enrichment in `tenx-ingest.conf`
# instead. Filters here would re-run on every event coming back from the
# sidecar.

input {
  # Bind on `0.0.0.0` so the port is reachable from outside loopback (e.g.
  # a Kubernetes kubelet probe). The Log10x sidecar connects via
  # `127.0.0.1` from inside the same pod.
  tcp {
    id    => "in_from_tenx"
    host  => "0.0.0.0"
    port  => 5045
    codec => json_lines
  }
}

output {
  # Replace `stdout` with your real destinations (`elasticsearch`,
  # `opensearch`, `splunk_hec`, `kafka`, `s3`, …). The `tag` field set by
  # the ingest pipeline survives the round trip, so destinations routing
  # on it (Splunk index, S3 prefix, Kafka topic, …) see the same value
  # they would without Log10x in the path.
  stdout {
    id    => "out_stdout"
    codec => json_lines
  }
}
