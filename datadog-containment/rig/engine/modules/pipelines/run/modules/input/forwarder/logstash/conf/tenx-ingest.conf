# ─────────────────────────────────────────────────────────────────────────────
# Log10x Logstash sidecar — ingest pipeline
# ─────────────────────────────────────────────────────────────────────────────
#
# Owns the sources, the enrichment filter chain, and the handoff to the
# Log10x sidecar via a `tcp` output with `codec => json_lines`.
#
#   sources ──► enrichment filters ──► tcp output ──► Log10x:5044
#                                                          │
#                                                          ▼
#                                                       Receiver
#                                                          │
#   destinations ◄── tcp input ◄── Log10x (:5045) ─────────┘  (see tenx-destinations.conf)
#
# Filters defined here run once per event before the handoff. Returning
# events flow through the separate `destinations` pipeline, which has no
# filters — so enrichment never double-fires.

input {
  # Replace this `file` block with your own sources (`beats`, `tcp`, `http`,
  # `syslog`, …). Every event that should be processed by Log10x flows
  # through this pipeline.
  file {
    id    => "in_file_example"
    path  => "/var/log/containers/*.log"
    codec => "json"
    start_position => "beginning"
  }
}

filter {
  # Put all your enrichment filters here — `grok`, `mutate`, `kv`, `date`,
  # `geoip`, `kubernetes`, etc.
  mutate {
    id          => "ingest_enrich"
    add_field   => { "cluster" => "${CLUSTER_NAME:unset}" }
    # Set a `tag` field — the Log10x sidecar reads it as the event's source
    # for rate-based grouping. Any value works; derive it from `[source]`
    # or `[fileset][name]` for finer-grained grouping in production.
    add_field   => { "tag" => "logstash" }
  }
}

output {
  # Hand off to the Log10x sidecar. On Linux/macOS swap `tcp` for the
  # `unix` output plugin and point `path` at a Unix domain socket.
  tcp {
    id    => "out_to_tenx"
    host  => "127.0.0.1"
    port  => 5044
    codec => json_lines
  }
}
