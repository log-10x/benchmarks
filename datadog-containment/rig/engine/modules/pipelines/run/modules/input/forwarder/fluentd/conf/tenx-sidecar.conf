# ─────────────────────────────────────────────────────────────────────────────
# Log10x Fluentd sidecar recipe
# ─────────────────────────────────────────────────────────────────────────────
#
# Drop this into your Fluentd config (or `@include` it) to wire Fluentd up to
# a Log10x sidecar process. Events flow:
#
#   sources ──► @INGEST ──► enrichment filters ──► out_forward ──► Log10x:24224
#                                                                       │
#                                                                       ▼
#                                                                    Receiver
#                                                                       │
#   destinations ◄── @OUTPUT ◄── in_forward ◄── Log10x (:24225) ────────┘
#
# How each event is handled:
#
#   1. Sources route into the `@INGEST` label.
#   2. Enrichment filters under `@INGEST` run exactly once.
#   3. The event is forwarded to the Log10x sidecar (TCP `:24224`).
#   4. Log10x processes the event (rate/policy filtering, optional compaction).
#   5. The processed event comes back into Fluentd on `:24225` and is routed
#      directly to the `@OUTPUT` label.
#   6. `@OUTPUT` contains only your destination `<match>` blocks — Fluentd's
#      label scoping keeps enrichment filters from running a second time.
#
# Run Log10x:
#
#   tenx @run/input/forwarder/fluentd @apps/receiver
#
# Run Fluentd:
#
#   fluentd -c <this-file>
#
# ─────────────────────────────────────────────────────────────────────────────

# Drop Fluentd's own internal logs so they don't loop back through @OUTPUT.
<label @FLUENT_LOG>
  <match **>
    @type null
    @id ignore_fluent_logs
  </match>
</label>

# ───────── INGEST: sources + enrichment + handoff to Log10x ─────────

# Replace this <source> with your own. Every source MUST route into @INGEST
# via the `@label @INGEST` directive — anything pointed elsewhere skips
# Log10x entirely.
<source>
  @type tail
  @id in_tail_example
  path /var/log/containers/*.log
  pos_file /var/log/fluentd-containers.pos
  read_from_head true
  tag k8s.containers
  @label @INGEST
  <parse>
    @type json
  </parse>
</source>

<label @INGEST>
  # Put all your enrichment filters here — k8s_metadata, parser,
  # record_transformer, etc. They run once per event before the handoff to
  # Log10x. The return path skips this label, so they never double-fire.
  <filter **>
    @type record_transformer
    # 'true' is required: with enable_ruby false, record_transformer resolves
    # only record/tag/time placeholders, so the ENV lookup below is never
    # evaluated and 'cluster' reaches your destination as null.
    enable_ruby true
    <record>
      cluster "${ENV['CLUSTER_NAME'] || 'unset'}"
    </record>
  </filter>

  # Hand off to the Log10x sidecar.
  # On Linux/macOS you can swap the <server> block for `<transport unix>`
  # plus a matching `path` to use a Unix domain socket instead of TCP.
  <match **>
    @type forward
    @id out_to_tenx
    # Sidecar topology — both processes share the pod's network namespace.
    # Keep the TCP connection up across chunks so we don't re-handshake
    # every flush_interval (the default `keepalive false` generates one
    # connect/disconnect cycle per chunk, burning CPU on the loopback
    # path and spamming Log10x's logs). Acks are also off — there's no
    # cross-host link to drop packets. For cross-host forwarding flip
    # both off the defaults: `require_ack_response true` and (typically)
    # a file-backed buffer for durability.
    keepalive true
    keepalive_timeout 60s
    send_timeout 5s
    require_ack_response false
    <server>
      host 127.0.0.1
      port 24224
    </server>
    <buffer>
      @type memory
      flush_interval 1s
      flush_thread_count 1
    </buffer>
  </match>
</label>

# ───────── EGRESS: receive processed events + ship to destinations ─────────

# Forward source receiving processed events back from Log10x. The original
# Fluentd tag is restored on the wire, so destinations routing on `$TAG`
# (Splunk index, S3 path, Kafka topic, …) see the same tag they would
# without Log10x in the path.
#
# Bind on 0.0.0.0 so a Kubernetes kubelet tcpSocket probe can reach the
# port from the pod IP — a loopback-only bind would refuse the probe.
# The Log10x sidecar still connects via 127.0.0.1 (same pod, same network
# namespace).
<source>
  @type forward
  @id in_from_tenx
  bind 0.0.0.0
  port 24225
  @label @OUTPUT
</source>

# `@OUTPUT` is the terminal label — replace the stdout `<match>` below with
# your real destinations (out_elasticsearch, out_splunk_hec, out_kafka2,
# out_s3, …). Keep this label filter-free; the label boundary is what keeps
# @INGEST's enrichment filters from running a second time on returning events.
<label @OUTPUT>
  <match **>
    @type stdout
    @id out_stdout
  </match>
</label>
