# ─────────────────────────────────────────────────────────────────────────────
# Log10x Logstash sidecar, pipelines.yml driver
# ─────────────────────────────────────────────────────────────────────────────
#
# Logstash runs two pipelines side-by-side:
#
#   • `ingest`      , your sources + filters, hands off to the Log10x sidecar
#   • `destinations`, receives processed events back from Log10x and routes
#                      them to your real destinations
#
# Filters under `ingest` only see events on the way in. The `destinations`
# pipeline is filter-free, so each event is enriched exactly once.
#
# Point `path.config` at copies of the per-pipeline `.conf` files you've
# customized for your environment.

- pipeline.id: ingest
  path.config: "${TENX_MODULES}/pipelines/run/modules/input/forwarder/logstash/conf/tenx-ingest.conf"

- pipeline.id: destinations
  path.config: "${TENX_MODULES}/pipelines/run/modules/input/forwarder/logstash/conf/tenx-destinations.conf"
