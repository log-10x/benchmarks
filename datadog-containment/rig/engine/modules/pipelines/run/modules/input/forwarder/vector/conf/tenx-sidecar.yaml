# ─────────────────────────────────────────────────────────────────────────────
# Log10x Vector sidecar recipe
# ─────────────────────────────────────────────────────────────────────────────
#
# Drop this into your Vector config (or merge its blocks into your existing
# Vector YAML) to wire Vector up to a Log10x sidecar process. Events flow:
#
#   sources ──► ingest transforms ──► tenx_in (socket sink) ──► Log10x:9000
#                                                                    │
#                                                                    ▼
#                                                                 Receiver
#                                                                    │
#   destinations ◄── tenx_out (fluent source) ◄── Log10x (:9001) ────┘
#
# How each event is handled:
#
#   1. Sources feed events into the `ingest` transform.
#   2. The `ingest` transform applies enrichment and stamps a `tag` field
#      for the Forward round trip (Vector has no native event-level tag).
#   3. The `tenx_in` socket sink forwards the enriched event to the Log10x
#      sidecar as newline-delimited JSON on TCP `:9000`.
#   4. Log10x processes the event (rate/policy filtering, optional compaction).
#   5. The processed event comes back to Vector on `:9001` via the `fluent`
#      source, surfacing on the `tenx_out` DAG node.
#   6. The `destinations` sink consumes `tenx_out` only, never `ingest` or
#      the raw sources, which is what guarantees enrichment runs exactly
#      once. Vector's DAG IS the bypass mechanism; no label scoping needed.
#
# Run Log10x:
#
#   tenx @run/input/forwarder/vector @apps/receiver
#
# Run Vector:
#
#   vector --config <this-file>
#
# ─────────────────────────────────────────────────────────────────────────────

sources:

  # Replace this <source> with your own. Anything not feeding the `ingest`
  # transform skips Log10x entirely; anything feeding `destinations` directly
  # skips the structural bypass and risks loops.
  app_logs:
    type: demo_logs
    format: json
    interval: 1.0

  # Receive processed events back from the Log10x sidecar.
  #
  # Bind on 0.0.0.0 so a Kubernetes kubelet tcpSocket probe can reach the
  # port from the pod IP, a loopback-only bind would refuse the probe.
  # The Log10x sidecar still connects via 127.0.0.1 (same pod, same network
  # namespace).
  #
  # On Linux/macOS swap `mode: tcp` + `address` for `mode: unix` + `path`
  # to use a Unix domain socket instead.
  tenx_out:
    type: fluent
    mode: tcp
    address: 0.0.0.0:9001

transforms:

  # Put all your enrichment here, `remap`, `filter`, `route`, k8s metadata
  # lookups, etc. This block fires exactly once per event before the handoff
  # to Log10x. The return path (`tenx_out` → `destinations`) bypasses it by
  # structural wiring.
  #
  # The `tag` field assignment below is what survives the Forward round trip
  # and surfaces as the Fluent tag inside Log10x; it's what `vectorTagField`
  # on the Log10x side reads.
  ingest:
    type: remap
    inputs: [app_logs]
    source: |
      .cluster = get_env_var("CLUSTER_NAME") ?? "unset"
      .tag = .source_type

sinks:

  # Hand off to the Log10x sidecar. On Linux/macOS you can swap `mode: tcp`
  # + `address` for `mode: unix` + `path` to use a Unix domain socket.
  tenx_in:
    type: socket
    inputs: [ingest]
    mode: tcp
    address: 127.0.0.1:9000
    encoding:
      codec: json
    framing:
      method: newline_delimited

  # `destinations` is the terminal sink, replace the console sink below
  # with your real destinations (`elasticsearch`, `splunk_hec`, `kafka`,
  # `aws_s3`, …). Keep its `inputs:` pointed only at `tenx_out`; that
  # structural wiring is what keeps the `ingest` transform from running
  # a second time on returning events.
  destinations:
    type: console
    inputs: [tenx_out]
    encoding:
      codec: json
