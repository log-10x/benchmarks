#
# 🔟❎ 'run' Vector module
#
# Vector integration, NDJSON socket input + Fluent Forward output.
# Declares the input + output options consumed by the paired streams.

module:

  name: vector

  title: Vector

  description: receive and optimize events collected by Vector via the socket sink and fluent source

  # 'configFolder' specifies a folder containing default configuration files for the settings defined by this unit/module
  configFolder: run/input/forwarder/vector

  doc: +include $=TenXEnv.get("docGenerate") ? "run/modules/input/forwarder/vector/doc.md":""

  allowMultiple: false

  options:

    - names:
        - vectorInputPort
      description: TCP port to listen on for events from Vector's socket sink
      type: String
      required: false
      category: input
      defValue: 9000
      doc: |
        TCP port where Log10x listens for events sent by Vector's `socket`
        sink (`mode: tcp`, `encoding.codec: json`, `framing.method: newline_delimited`).
        Match this against the `address` in your Vector sink.

    - names:
        - vectorInputPath
      description: Unix domain socket path to listen on (Linux/macOS)
      type: String
      required: false
      category: input
      defValue:
      doc: |
        When set, Log10x listens on a Unix domain socket instead of TCP, useful
        on Linux/macOS to avoid TCP overhead. Configure Vector's `socket` sink
        with `mode: unix` and a matching `path`. Ignored on Windows.

    - names:
        - vectorInputMessageField
      description: name of the JSON field carrying the original log line
      type: String
      required: false
      category: input
      defValue: message
      doc: |
        Name of the field in each Vector record that contains the actual log
        message text. The default (`message`) matches Vector's convention for
        the `file`, `kubernetes_logs`, `journald`, and `socket` sources. Set
        to e.g. `log` if your sources emit the log line under a different key.

    - names:
        - vectorOutputHost
      description: TCP host of the Vector fluent source receiving processed events
      type: String
      required: false
      category: output
      defValue: 127.0.0.1
      doc: |
        Hostname or IP where Vector's `fluent` source is listening for
        processed events from Log10x. Pairs with `vectorOutputPort`.

    - names:
        - vectorOutputPort
      description: TCP port of the Vector fluent source receiving processed events
      type: String
      required: false
      category: output
      defValue: 9001
      doc: |
        TCP port where Vector's `fluent` source is listening for processed
        events from Log10x. MUST differ from the port Log10x's own socket
        input listens on (default `9000`) or the two would collide on the
        same listener.

    - names:
        - vectorOutputPath
      description: Unix domain socket path of the Vector fluent source (Linux/macOS)
      type: String
      required: false
      category: output
      defValue:
      doc: |
        Optional Unix domain socket path for Vector's `fluent` source.
        When set, takes precedence over `vectorOutputHost` / `vectorOutputPort`.
        Linux/macOS only, ignored on Windows.

    - names:
      - vectorOutputEncodeType
      description: "output format when outputFields are set. Possible values: [json, delimited]"
      type: string
      required: false
      category: output
      defValue: delimited
      doc: |
        specifies how the combined output (main event field plus outputFields)
        is encoded when writing back to Vector. Possible values:
        - **json**: formats all fields as a JSON object
        - **delimited**: formats field values separated by the output delimiter
        Only takes effect when vectorOutputFields is set.
