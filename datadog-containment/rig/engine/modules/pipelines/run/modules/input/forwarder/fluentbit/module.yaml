#
# 🔟❎ 'run' Fluent Bit module
#
# Fluent Bit integration over the Fluent Forward protocol. Declares
# the input + output options consumed by the paired streams.

module:

  name: fluentbit

  title: Fluent Bit

  description: receive and optimize events collected by Fluent Bit via the Fluent Forward protocol

  # 'configFolder' specifies a folder containing default configuration files for the settings defined by this unit/module
  configFolder: run/input/forwarder/fluentbit

  doc: +include $=TenXEnv.get("docGenerate") ? "run/modules/input/forwarder/fluentbit/doc.md":""

  allowMultiple: false

  options:

    - names:
        - fluentbitInputPort
      description: TCP port to listen on for events from Fluent Bit's forward output
      type: String
      required: false
      category: input
      defValue: 24224
      doc: |
        TCP port where Log10x listens for events sent by Fluent Bit's `forward`
        output. Match this against the `Port` in your Fluent Bit `[OUTPUT]`
        block (`Name forward`).

    - names:
        - fluentbitInputPath
      description: Unix domain socket path to listen on (Linux/macOS)
      type: String
      required: false
      category: input
      defValue:
      doc: |
        When set, Log10x listens on a Unix domain socket instead of TCP, useful
        on Linux/macOS to avoid TCP overhead. Configure Fluent Bit's `forward`
        output with `Unix_Path` set to a matching path. Ignored on Windows.

    - names:
        - fluentbitInputMessageField
      description: name of the JSON field carrying the original log line
      type: String
      required: false
      category: input
      defValue: log
      doc: |
        Name of the field in each Fluent Bit record that contains the actual
        log message text. The default (`log`) matches Fluent Bit's `tail`
        input convention for container and file logs. Set to e.g. `message`
        if your sources emit the log line under a different key.

    - names:
        - fluentbitOutputHost
      description: TCP host of the Fluent Bit forward input receiving processed events
      type: String
      required: false
      category: output
      defValue: 127.0.0.1
      doc: |
        Hostname or IP where Fluent Bit's `forward` input is listening for
        processed events from Log10x. Pairs with `fluentbitOutputPort`.

    - names:
        - fluentbitOutputPort
      description: TCP port of the Fluent Bit forward input receiving processed events
      type: String
      required: false
      category: output
      defValue: 24225
      doc: |
        TCP port where Fluent Bit's `forward` input is listening for processed
        events from Log10x. MUST differ from the port Log10x's own Forward
        input listens on (default `24224`) or the two would collide on the
        same socket.

    - names:
        - fluentbitOutputPath
      description: Unix domain socket path of the Fluent Bit forward input (Linux/macOS)
      type: String
      required: false
      category: output
      defValue:
      doc: |
        Optional Unix domain socket path for Fluent Bit's `forward` input.
        When set, takes precedence over `fluentbitOutputHost` /
        `fluentbitOutputPort`. Linux/macOS only, ignored on Windows.

    - names:
      - fluentbitOutputEncodeType
      description: "output format when outputFields are set. Possible values: [json, delimited]"
      type: string
      required: false
      category: output
      defValue: delimited
      doc: |
        specifies how the combined output (main event field plus outputFields)
        is encoded when writing back to Fluent Bit. Possible values:
        - **json**: formats all fields as a JSON object
        - **delimited**: formats field values separated by the output delimiter
        Only takes effect when fluentbitOutputFields is set.
