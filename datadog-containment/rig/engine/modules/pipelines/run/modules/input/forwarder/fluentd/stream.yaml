# 🔟❎ 'run' Fluentd input + output streams
#
# Listens for events from Fluentd's `out_forward` plugin and sends
# processed events back to a paired `in_forward` source, both legs
# over the native Fluent Forward protocol (TCP or Unix domain socket).

tenx: run

runtimeAttributes:
  - fwd_input:fluentd

include:
  - run/modules/output/event/forward

# ============================== Extractor ====================================

extractor:
  - name: fluentd
    type: json
    actions:
      # Capture the configurable message field as the event's text
      - $=yield "captureFirst:" + TenXEnv.get("fluentdInputMessageField", "log")
      # The Forward decoder surfaces the wire tag as a `tag` field for the
      # `sourcePattern` to capture below; remove it from the record body so
      # the event going back out to Fluentd has the same shape as the one
      # that arrived.
      - drop:tag

# ============================== Input ========================================

input:

  - type: stream
    name: fluentd

    # Fluent Forward protocol decoder (msgpack over TCP or Unix socket)
    path: com.log10x.ext.edge.input.forward.ForwardProtocolInputStream

    # Apply the Fluentd extractor above; add the k8s extractor automatically
    # when the Receiver app sets `k8sExtractorName: fluentK8s`.
    extractors:
      - fluentd
      - "$=yield TenXEnv.get(\"k8sExtractorName\") ? \"fluentK8s\" : \"\""

    # Use the wire-level Fluentd tag as the event's source.
    sourcePattern: \"tag\":\"(.*?)\"

    args:
      # Listen on this TCP port
      - port
      - $=yield TenXEnv.get("fluentdInputPort", "24224")
      # Pass path if it exists, which will set it instead of the port
      - '$=yield TenXEnv.get("fluentdInputPath", "") ? "path" : ""'
      - $=yield TenXEnv.get("fluentdInputPath", "")

    # Backpressure ceiling, Log10x stops draining the Forward socket once
    # this many bytes have arrived in `intervalBytesDuration`, signalling
    # Fluentd to buffer instead of overwhelming the pipeline.
    backpressure:
      intervalBytesLimit: $=parseBytes("2MB")
      intervalBytesDuration: $=parseDuration("1s")

# ============================== Output =======================================

outputForward:

  - hostAddress: $=yield TenXEnv.get("fluentdOutputHost", "127.0.0.1")
    hostPort: $=yield TenXEnv.get("fluentdOutputPort", "24225")
    address: $=yield TenXEnv.get("fluentdOutputPath")

    fields:
      # Carries the whole Fluentd record in receive mode and an encoded
      # form in compact mode. Picked automatically based on the Receiver
      # app's mode (`receiverOptimize`, `compactReceiverLookupFile`,
      # `symbolMessageHashField`).
      - $?outputEncodeField=fullText

    # Emit each top-level field of the rendered record as its own field on
    # the outgoing Forward event, so the record structure of the original
    # Fluentd event survives the round trip.
    encodeType: $?fluentdOutputEncodeType=delimited

    writeTemplates: $?outputWriteTemplates=false
