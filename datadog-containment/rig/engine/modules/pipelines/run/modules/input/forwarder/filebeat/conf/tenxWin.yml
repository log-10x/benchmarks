#
# 🔟❎ Filebeat 'receive' configuration

# This Filebeat configuration reads filtered tenxObjects from the 10x engine.
# Include this in the Filebeat master 'filebeat.yml' config using a 'filebeat.config.inputs' stanza.

# To learn more see https://www.elastic.co/guide/en/beats/filebeat/current/filebeat-configuration-reloading.html#load-input-config

# Events filtered by the 10x engine are returned via a UNIX in-mem socket
- type: unix
  max_message_size: 10MiB

  # The location of the UNIX client socket is read from 'path' below
  # by the 10x process to connect to the correct socket address

  # WIN
  path: ${TEMP}\tenx_filebeat.sock

  # Decode JSON event back to Filebeat records
  processors:
  - decode_json_fields:
      fields: ["message"]
      process_array: false
      max_depth: 1
      target: ""
      overwrite_keys: true
      add_error_key: true

      # For 10x templates, we need the document ID in ES to match the template hash.
      # This also removes the 'templateHashDocId' from the actual document.
      # See: https://www.elastic.co/guide/en/beats/filebeat/current/decode-json-fields.html
      document_id: "templateHashDocId"
  - copy_fields:
      # The l1es Elasticsearch plugin reads the template text from a field named
      # 'pattern' (DmlConsts.DML_PATTERN_ATTRIBUTE), and its l1es_dml mapping
      # declares only that field. The engine emits 'template'. Copy rather than
      # rename: the chart routes template events to l1es_dml with
      # when.has_fields: ["template", "templateHash"], so removing 'template'
      # here would send them to the data index instead.
      fields:
        - from: "template"
          to: "pattern"
      fail_on_error: false
      ignore_missing: true
  - drop_fields:
      fields: ["tenx"]
