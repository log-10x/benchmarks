# ─────────────────────────────────────────────────────────────────────────────
# Log10x Fluent Bit sidecar recipe
# ─────────────────────────────────────────────────────────────────────────────
#
# Drop this into your Fluent Bit config (or `@INCLUDE` it) to wire Fluent Bit
# up to a Log10x sidecar process. Events flow:
#
#   sources (app.*) ──► filters (Match app.*) ──► out_forward ──► Log10x:24224
#                                                                       │
#                                                                       ▼
#                                                                    Receiver
#                                                                       │
#   destinations (Match tenx.*) ◄── in_forward Tag_Prefix tenx. ◄── Log10x (:24225)
#
# How each event is handled:
#
#   1. Sources tag events with the user's normal scheme (e.g. `app.*`).
#   2. Enrichment filters `Match app.*` and run exactly once.
#   3. An `out_forward` with `Match app.*` ships the event to Log10x.
#   4. Log10x processes the event (rate/policy filtering, optional compaction).
#   5. The processed event comes back into Fluent Bit on `:24225`. The egress
#      `forward` input has `Tag_Prefix tenx.`, so an event whose original tag
#      was `app.foo` arrives as `tenx.app.foo`.
#   6. Destinations `Match tenx.*` — the `tenx.` prefix is the bypass.
#      Filters and the ingest `out_forward` (which `Match app.*`) skip the
#      returning events by tag-namespacing alone. Fluent Bit has no label or
#      scope concept; tag-prefixing IS the bypass mechanism.
#
# Run Log10x:
#
#   tenx @run/input/forwarder/fluentbit @apps/receiver
#
# Run Fluent Bit:
#
#   fluent-bit -c <this-file>
#
# ─────────────────────────────────────────────────────────────────────────────

[SERVICE]
    Flush        1
    Log_Level    info
    Parsers_File parsers.conf

# ───────── INGEST: sources + enrichment + handoff to Log10x ─────────

# Replace this [INPUT] with your own. Tag your sources with anything that does
# NOT start with `tenx.` (the prefix the egress `forward` input below applies)
# so the bypass works.
[INPUT]
    Name         dummy
    Tag          app.example
    Dummy        {"log":"hello from fluent-bit","host":"example"}
    Rate         1

# Put all your enrichment filters here — `kubernetes`, `modify`, `parser`,
# `lua`, etc. `Match` them against your source tag pattern (NOT `*`) so they
# skip the returning `tenx.*` events. They run once per event before the
# handoff to Log10x.
[FILTER]
    Name         modify
    Match        app.*
    Add          cluster ${CLUSTER_NAME}

# Hand off to the Log10x sidecar.
# On Linux/macOS you can swap `Host`/`Port` for `Unix_Path` to use a Unix
# domain socket instead of TCP.
[OUTPUT]
    Name         forward
    Match        app.*
    Host         127.0.0.1
    Port         24224
    Retry_Limit  False

# ───────── EGRESS: receive processed events + ship to destinations ─────────

# Forward input receiving processed events back from Log10x. `Tag_Prefix tenx.`
# is the bypass: every returning event has `tenx.` prepended to its original
# tag, so user filters and the ingest `out_forward` (which `Match app.*`) do
# not re-fire on the round trip.
#
# Listen on 0.0.0.0 so a Kubernetes kubelet tcpSocket probe can reach the
# port from the pod IP — a loopback-only bind would refuse the probe. The
# Log10x sidecar still connects via 127.0.0.1 (same pod, same network
# namespace).
[INPUT]
    Name         forward
    Listen       0.0.0.0
    Port         24225
    Tag_Prefix   tenx.

# `Match tenx.*` is the terminal stage — replace the `stdout` below with your
# real destinations (`es`, `splunk`, `kafka`, `s3`, …). The `tenx.` prefix is
# what keeps the ingest filters and `out_forward` from re-processing these.
# If your destination needs the original tag back, prepend a `Match tenx.*`
# rewrite_tag filter or strip the prefix in your output's path/index template.
[OUTPUT]
    Name         stdout
    Match        tenx.*
