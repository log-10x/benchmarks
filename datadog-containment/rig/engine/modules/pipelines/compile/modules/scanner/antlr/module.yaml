#
# 🔟❎ 'compile' ANTLR scanner module

module:

  name: antlr

  title: ANTLR scanner

  description: extract symbols from any programming language using the ANTLR framework

  # 'doc' specifies the markdown doc content, only required when generating docs.
  doc: +include $=TenXEnv.get("docGenerate") ? "compile/modules/scanner/antlr/doc.md":""
  
  # 'configFolder' specifies a folder containing default configuration files for the settings defined by this unit/module
  configFolder: compile/scanners/antlr

  configSort:
    antlr: [java, cpp, scala, go, javascript, typescript, python, csharp, rust]

  # 'allowMultiple' is disabled for this module. Pipeline command line arguments and configuration files
  #  can specify a single value at max for each option defined below.
  allowMultiple: false
  
  # 'options' defines a group of named/typed configuration values to pass to a unit/module at startup
  #  via command line arguments (e.g., '> tenx -myA X -myB Y') or YAML launch files (e.g., '> tenx @my.config').
  #  Instances of this group passed are accessible at runtime via TenXEnv.get: https://doc.log10x.com/api/js/#TenXEnv.get
  options: 

    - names:
      - antlrParseUnitTimeout
      description: source file parse timeout
      type: string
      required: false
      doc: |
        defines the timeout interval for parsing and scanning a source/binary input file before aborting.
        default value: 60sec

    - names:
      - antlrParseUnitTokenBudget
      description: source file parse token read budget
      type: number
      required: false
      defValue: 0
      doc: |
        caps the number of token stream reads a single source file parse may make before it is
        stopped. The symbols found up to the stop are kept and the unit is marked with an error.
        The count depends on the file and the grammar only, so the same file stops at the same
        point on any machine. 0 disables the cap.

    - names:
      - antlrParseUnitSkipPaths
      description: regex patterns for skipping the parse of matching source files
      type: list
      required: false
      doc: |
        lists regex patterns matched (find) against a source file's path and name, in the form
        '/github/owner_repo/dir/file.cpp'. A matching file is not parsed by ANTLR: its unit carries
        the warning 'antlr parse skipped by parseUnitSkipPaths' and goes to the fallback scanner.
        Repeat the option for each pattern.
