# Rig Fluent Bit pipeline.
#   Docker fluentd driver (tag app.<container>) -> [raw.jsonl] -> Receiver (tenx:24224)
#   Receiver (:24225, Tag_Prefix tenx.) -> split by routeState -> pass / offload / tier_down / other
# Fluent Bit listens only on the private Docker network (no published port): this Mac runs a
# host td-agent on IPv4 *:24224.

[SERVICE]
    Flush        1
    Log_Level    info
    Grace        10
    HTTP_Server  On
    HTTP_Listen  0.0.0.0
    HTTP_Port    2020

# Ingest from the Docker fluentd log driver.
[INPUT]
    Name        forward
    Listen      0.0.0.0
    Port        24224
    Buffer_Max_Size   16M
    Buffer_Chunk_Size 1M

[FILTER]
    Name    lua
    Match   app.*
    script  /fluent-bit/etc/rig/rig.lua
    call    prep

# Raw copy, before the Receiver.
[OUTPUT]
    Name    file
    Match   app.*
    Path    /data
    File    raw.jsonl
    Format  plain

# Hand off to the Receiver: one worker, one keepalive connection (the Receiver's forward
# input serves one client at a time).
[OUTPUT]
    Name                        forward
    Match                       app.*
    Host                        tenx
    Port                        24224
    Retry_Limit                 False
    Workers                     1
    net.max_worker_connections  1
    net.keepalive               on
    net.keepalive_max_recycle   100000000
    net.keepalive_idle_timeout  300

# Return path from the Receiver.
[INPUT]
    Name        forward
    Listen      0.0.0.0
    Port        24225
    Tag_Prefix  tenx.
    Buffer_Max_Size   16M
    Buffer_Chunk_Size 1M

[FILTER]
    Name    lua
    Match   tenx.*
    script  /fluent-bit/etc/rig/rig.lua
    call    route

[FILTER]
    Name    rewrite_tag
    Match   tenx.*
    Rule    $_route ^offload$   routed.offload   true
    Rule    $_route ^tier_down$ routed.tier_down true
    Rule    $_route ^pass$      routed.pass      true
    Rule    $_route ^other$     routed.other     true

[FILTER]
    Name        record_modifier
    Match       routed.*
    Remove_key  _route

[OUTPUT]
    Name    file
    Match   routed.pass
    Path    /data
    File    pass.jsonl
    Format  plain

[OUTPUT]
    Name    file
    Match   routed.offload
    Path    /data
    File    offload.jsonl
    Format  plain

[OUTPUT]
    Name    file
    Match   routed.tier_down
    Path    /data
    File    tier_down.jsonl
    Format  plain

[OUTPUT]
    Name    file
    Match   routed.other
    Path    /data
    File    other.jsonl
    Format  plain
