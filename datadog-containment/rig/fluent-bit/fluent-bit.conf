# Rig Fluent Bit pipeline.
#   Docker fluentd driver (tag app.<container>) -> [raw.jsonl] -> Receiver (:24224)
#   Receiver (:24225, Tag_Prefix tenx.) -> split by routeState -> pass.jsonl / offload.jsonl

[SERVICE]
    Flush        1
    Log_Level    info
    Grace        10
    HTTP_Server  On
    HTTP_Listen  0.0.0.0
    HTTP_Port    2020

# Ingest from the Docker fluentd log driver.
[INPUT]
    Name        forward
    Listen      0.0.0.0
    Port        24224
    Buffer_Max_Size   16M
    Buffer_Chunk_Size 1M

# Strip the leading slash Docker puts on container_name; stamp the ingest time.
[FILTER]
    Name   lua
    Match  app.*
    call   prep
    code   function prep(tag,ts,rec) local c=rec["container_name"] if c then rec["container_name"]=string.gsub(c,"^/","") end rec["fb_ts"]=string.format("%.3f",ts) return 2,ts,rec end

# Raw copy, before the Receiver.
[OUTPUT]
    Name    file
    Match   app.*
    Path    /data
    File    raw.jsonl
    Format  plain

# Hand off to the Receiver: one worker, one keepalive connection (the Receiver's forward
# input serves one client at a time).
[OUTPUT]
    Name                        forward
    Match                       app.*
    Host                        tenx
    Port                        24224
    Retry_Limit                 False
    Workers                     1
    net.max_worker_connections  1
    net.keepalive               on
    net.keepalive_max_recycle   100000000
    net.keepalive_idle_timeout  300

# Return path from the Receiver.
[INPUT]
    Name        forward
    Listen      0.0.0.0
    Port        24225
    Tag_Prefix  tenx.
    Buffer_Max_Size   16M
    Buffer_Chunk_Size 1M

# routeState -> routing key, then re-tag so each slice has its own file.
[FILTER]
    Name   lua
    Match  tenx.*
    call   route
    code   function route(tag,ts,rec) local r=rec["routeState"] if r=="offload" then rec["_route"]="offload" else rec["_route"]="pass" end return 2,ts,rec end

[FILTER]
    Name    rewrite_tag
    Match   tenx.*
    Rule    $_route ^offload$ routed.offload true
    Rule    $_route ^pass$    routed.pass    true

[FILTER]
    Name        record_modifier
    Match       routed.*
    Remove_key  _route

[OUTPUT]
    Name    file
    Match   routed.offload
    Path    /data
    File    offload.jsonl
    Format  plain

[OUTPUT]
    Name    file
    Match   routed.pass
    Path    /data
    File    pass.jsonl
    Format  plain
