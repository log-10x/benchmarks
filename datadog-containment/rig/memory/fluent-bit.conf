# Replay pipeline for the Receiver memory measurement.
#   replay.py -> :24224 -> Receiver (tenx:24224) -> :24225 -> split by routeState
# The hand-off and return path are the run's own (../fluent-bit/fluent-bit.conf); the
# Docker-driver ingest filter and the raw copy are left out, because the replayed records
# are the raw copy. Every port is on the private Docker network only.

[SERVICE]
    Flush        1
    Log_Level    info
    Grace        10

[INPUT]
    Name        forward
    Listen      0.0.0.0
    Port        24224
    Buffer_Max_Size   16M
    Buffer_Chunk_Size 1M

[OUTPUT]
    Name                        forward
    Match                       app.*
    Host                        tenx
    Port                        24224
    Retry_Limit                 False
    Workers                     1
    net.max_worker_connections  1
    net.keepalive               on
    net.keepalive_max_recycle   100000000
    net.keepalive_idle_timeout  300

[INPUT]
    Name        forward
    Listen      0.0.0.0
    Port        24225
    Tag_Prefix  tenx.
    Buffer_Max_Size   16M
    Buffer_Chunk_Size 1M

[FILTER]
    Name    lua
    Match   tenx.*
    script  /fluent-bit/etc/rig/rig.lua
    call    route

[FILTER]
    Name    rewrite_tag
    Match   tenx.*
    Rule    $_route ^offload$   routed.offload   true
    Rule    $_route ^tier_down$ routed.tier_down true
    Rule    $_route ^pass$      routed.pass      true
    Rule    $_route ^other$     routed.other     true

[FILTER]
    Name        record_modifier
    Match       routed.*
    Remove_key  _route

[OUTPUT]
    Name    file
    Match   routed.pass
    Path    /data
    File    pass.jsonl
    Format  plain

[OUTPUT]
    Name    file
    Match   routed.offload
    Path    /data
    File    offload.jsonl
    Format  plain

[OUTPUT]
    Name    file
    Match   routed.tier_down
    Path    /data
    File    tier_down.jsonl
    Format  plain

[OUTPUT]
    Name    file
    Match   routed.other
    Path    /data
    File    other.jsonl
    Format  plain
