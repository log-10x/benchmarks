# Generated by install-e2e/render.mjs from log10x_advise_install's values (receiver.json). Do not edit.
services:
  tenx:
    image: "ghcr.io/log-10x/edge-10x:1.1.150"
    container_name: e100-tenx
    environment:
      - "TENX_AIRGAPPED=true"
      - "K8S_ENABLED=false"
      - "CAP_LOOKUP_FILE=/policy/caps.csv"
      - "ACTION_LOOKUP_FILE=/policy/actions.csv"
      - "TOTAL_LOOKUP_FILE=/policy/totals.csv"
      - "TENX_FLUENTBIT_OUTPUT_HOST=fluent-bit"
    tmpfs:
      - /tmp
    volumes:
      - ${RESULTS}/policy:/policy:ro
    command:
      - "@run/input/forwarder/fluentbit"
      - "@apps/receiver"
      - "symbolMessageHashField"
      - "tenx_hash"
      - "outputEncodeField"
      - "fullText(\"tenx_hash\",\"routeState\",\"message_pattern\",\"severity_level\",\"utf8Size\")"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "512M"
