# Log10x recurring cost-reduction policy
# Generated by log10x_setup_recurring: edit and re-commit as needed.
# The CLI reads this file at the start of each tick.
schema_version: "1.0"

reduction:
  # empty = all services
  target_services: []
  # Elasticsearch hot tier held under a size: GB of index store on the hot nodes,
  # or auto for 80% of their disk (Elasticsearch stops allocating at 85%).
  # Each run rewrites the byte limits so growth goes to the frozen tier.
  hot_tier_gb: 0.063
  # hours a kept line stays on hot: read from the ILM policy on pass_alias unless set here
  # hot_retention_hours: 168
  pass_alias: tenx-app
  tier_down_alias: tenx-tierdown
  container_field: kubernetes.container_name
  # error lines over a limit that pass per statement per node per window
  keep_count: 50
  default_action: tier_down
  nodes_by_container:
    accounting: 1
    ad: 1
    aws-eks-nodeagent: 1
    aws-node: 1
    aws-vpc-cni-init: 1
    cart: 1
    coredns: 1
    currency: 1
    email: 1
    flagd: 1
    flagd-ui: 1
    fluentd-10x: 1
    fraud-detection: 1
    frontend: 1
    frontend-proxy: 1
    grafana: 1
    grafana-sc-alerts: 1
    grafana-sc-dashboard: 1
    grafana-sc-datasources: 1
    image-provider: 1
    init-config: 1
    jaeger: 1
    kafka: 1
    kube-proxy: 1
    load-generator: 1
    metrics-server: 1
    opensearch: 1
    opentelemetry-collector: 1
    payment: 1
    postgresql: 1
    prometheus-server: 1
    quote: 1
    recommendation: 1
    valkey-cart: 1
    wait-for-kafka: 1
    wait-for-valkey-cart: 1
  exceptions: []
  min_delta_pp: 2

schedule:
  preset: hourly
  cron_utc: "0 * * * *"
  scheduler: github_actions

config_plane:
  repo: /Users/talweiss/git/l1x-co/wt-el2arm/elastic-hot-tier-budget/results-two-arm/policy-clone
  delivery: gitops
  # the run commits straight to this branch; the engine's gitops pull reads it (GH_BRANCH)
  policy_branch: test/elastic-hot-tier-policy

