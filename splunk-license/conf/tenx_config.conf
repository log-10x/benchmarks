# Overrides the app's default dest_dml_index of "main". The app writes a searchable copy of
# each template when its Consume KV alert fills the KV store. Pointing it at the compact
# arm's own index puts whatever the meter counts for it on the compact arm: in the
# 2026-09-18 run the app wrote it through /services/receivers/simple and the meter counted
# it; from app 1.1.4 it is written with `collect` as sourcetype stash, which the meter
# does not count.
[config]
dest_dml_index = tenx_dml
