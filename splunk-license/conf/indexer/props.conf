# etc/system/local, so both arms get the same parsing settings and neither can
# win on a setting the other did not have. TRUNCATE = 0 matters: the default
# 10,000 bytes would silently shorten events and understate whichever arm has
# the longer lines. The dataset's longest line is 3,207 bytes, so nothing is
# truncated either way; the setting is here so that stays true on another file.
#
# DATETIME_CONFIG = CURRENT on both arms. A compact event carries no timestamp
# Splunk can find, so leaving timestamp extraction on would give the two arms
# different time handling. Licence metering is by ingest time in every case, so
# this moves no metered byte.

[tenx_raw_json]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 0
DATETIME_CONFIG = CURRENT
CHARSET = UTF-8
KV_MODE = none

[tenx_encoded]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 0
DATETIME_CONFIG = CURRENT
CHARSET = UTF-8

[tenx_dml_raw_json]
TRUNCATE = 0
DATETIME_CONFIG = CURRENT
CHARSET = UTF-8
