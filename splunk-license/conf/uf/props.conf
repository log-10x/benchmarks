# The same parsing settings as the indexer. tenx_dml_raw_json needs its
# INDEXED_EXTRACTIONS here rather than only on the indexer, because structured
# data is parsed on the forwarder.

[tenx_raw_json]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 0
DATETIME_CONFIG = CURRENT
CHARSET = UTF-8

[tenx_encoded]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 0
DATETIME_CONFIG = CURRENT
CHARSET = UTF-8

[tenx_dml_raw_json]
INDEXED_EXTRACTIONS = json
KV_MODE = none
LINE_BREAKER = ([\r\n]+)
NO_BINARY_CHECK = true
TRUNCATE = 0
DATETIME_CONFIG = CURRENT
CHARSET = UTF-8
