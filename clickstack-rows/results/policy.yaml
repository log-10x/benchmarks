# Log10x recurring cost-reduction policy
# Generated by log10x_setup_recurring: edit and re-commit as needed.
# The CLI reads this file at the start of each tick.
schema_version: "1.0"

reduction:
  # empty = all services
  target_services: []
  # ClickHouse: rows written into the logs table an hour, held at this figure,
  # or auto for the meter's last complete hour at the first run. Each run reads
  # NewPart rows from system.part_log and rewrites the per-statement limits and
  # service totals, in lines, so the excess goes to the account's own bucket
  # before ClickHouse receives it.
  rows_per_hour: 29399
  # time-scaled rig: the meter's window, read as a rate an hour (60 in production)
  meter_minutes: 10
  clickhouse_table: default.otel_logs
  # the Prometheus label carrying the container (the regulator's containerField)
  container_label: k8s_container
  # error lines over a limit that pass per statement per node per window
  keep_count: 50
  default_action: offload
  nodes_by_container:
    accounting: 1
    ad: 1
    aws-eks-nodeagent: 1
    aws-node: 1
    aws-vpc-cni-init: 1
    cart: 1
    coredns: 1
    currency: 1
    email: 1
    flagd: 1
    flagd-ui: 1
    fluentd-10x: 1
    fraud-detection: 1
    frontend: 1
    frontend-proxy: 1
    grafana: 1
    grafana-sc-alerts: 1
    grafana-sc-dashboard: 1
    grafana-sc-datasources: 1
    image-provider: 1
    init-config: 1
    jaeger: 1
    kafka: 1
    kube-proxy: 1
    load-generator: 1
    metrics-server: 1
    opensearch: 1
    opentelemetry-collector: 1
    payment: 1
    postgresql: 1
    prometheus-server: 1
    quote: 1
    recommendation: 1
    valkey-cart: 1
    wait-for-kafka: 1
    wait-for-valkey-cart: 1
    inventory: 1
  exceptions: []
  min_delta_pp: 2

schedule:
  preset: hourly
  cron_utc: "0 * * * *"
  scheduler: github_actions

config_plane:
  repo: /Users/talweiss/git/l1x-co/wt-ch-bench/clickstack-rows/results/policy-clone
  delivery: gitops
  # the run commits straight to this branch; the engine's gitops pull reads it (GH_BRANCH)
  policy_branch: test/clickhouse-rows-policy
  env_id: edge

