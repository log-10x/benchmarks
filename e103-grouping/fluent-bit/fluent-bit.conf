# E103 grouping rig: the hot-tier rig's Fluent Bit path with Elasticsearch dropped.
#   sender (Forward, 24224) -> prep -> [in.jsonl] -> Receiver (tenx:24224, one worker, one connection)
#   Receiver (24225, Tag_Prefix tenx.) -> [returned.jsonl]
# The forward output block is the hot-tier rig's, setting for setting.

[SERVICE]
    Flush        1
    Log_Level    info
    Grace        10
    HTTP_Server  On
    HTTP_Listen  0.0.0.0
    HTTP_Port    2020

[INPUT]
    Name        forward
    Listen      0.0.0.0
    Port        24224
    Buffer_Max_Size   16M
    Buffer_Chunk_Size 1M

[FILTER]
    Name    lua
    Match   app.*
    script  /fluent-bit/etc/rig/prep.lua
    call    prep

[FILTER]
    Name    lua
    Match   docker.*
    script  /fluent-bit/etc/rig/prep.lua
    call    prep

[OUTPUT]
    Name    file
    Match_Regex ^(app|docker)\.
    Path    /data
    File    in.jsonl
    Format  plain

[OUTPUT]
    Name                        forward
    Match_Regex                 ^(app|docker)\.
    Host                        tenx
    Port                        24224
    Retry_Limit                 False
    Workers                     1
    net.max_worker_connections  1
    net.keepalive               on
    net.keepalive_max_recycle   100000000
    net.keepalive_idle_timeout  300

[INPUT]
    Name        forward
    Listen      0.0.0.0
    Port        24225
    Tag_Prefix  tenx.
    Buffer_Max_Size   16M
    Buffer_Chunk_Size 1M

[OUTPUT]
    Name    file
    Match   tenx.*
    Path    /data
    File    returned.jsonl
    Format  plain
