name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  drain3-vs-log10x:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r drain3-vs-log10x/requirements.txt

      - name: Syntax-check the harness
        run: python -m py_compile drain3-vs-log10x/bench/*.py drain3-vs-log10x/smoke_test.py

      - name: Smoke test (Drain3 mechanism, no Docker)
        run: python drain3-vs-log10x/smoke_test.py

  pattern-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # requirements.txt records verification on 3.13; keep CI on the same line.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install deps
        run: pip install -r pattern-identity/requirements.txt

      - name: Syntax-check the harness
        run: python -m py_compile pattern-identity/bench/*.py

      # The replay is the one experiment that needs no download and no Docker.
      # Its asserts are the falsifier for the whole first section of the README,
      # so a drain3 release that changes the mechanism fails here.
      - name: Replay exhibit (Drain3 mechanism, no download, asserts live)
        run: python pattern-identity/bench/replay.py

  otel-denominators:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Syntax-check the harness
        run: |
          python -m py_compile otel-denominators/build_inputs.py otel-denominators/report.py
          bash -n otel-denominators/run.sh

      # The full run needs Docker and a 215 MB download. What CI can check
      # without either is that the committed table still follows from the
      # committed counts: re-render results.md from results.csv and diff it.
      # An edited percentage, or a byte count changed without a rerun, fails here.
      - name: The committed table follows from the committed counts
        run: |
          cd otel-denominators
          image=$(sed -n 's/^- engine image: `\(.*\)`$/\1/p' results/results.md)
          gz=$(sed -n 's/^- capture, gzipped as published: sha256 `\(.*\)`$/\1/p' results/results.md)
          plain=$(sed -n 's/^- capture, expanded: sha256 `\(.*\)`$/\1/p' results/results.md)
          python report.py --csv results/results.csv --out /tmp/results.md \
            --image "$image" --asset-gz-sha256 "$gz" --asset-sha256 "$plain"
          diff -u results/results.md /tmp/results.md

  clickhouse-clickstack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Syntax-check the harness
        run: |
          python -m py_compile clickhouse-clickstack/*.py
          bash -n clickhouse-clickstack/run.sh clickhouse-clickstack/run_typed.sh clickhouse-clickstack/run_compute.sh clickhouse-clickstack/run_policy.sh clickhouse-clickstack/run_policy_s3.sh clickhouse-clickstack/run_labeled.sh clickhouse-clickstack/run_query_compute.sh clickhouse-clickstack/run_lossless.sh clickhouse-clickstack/run_scale.sh clickhouse-clickstack/run_scale_bytype.sh

      # The four template constructs the shipped install.sql does not implement,
      # each with a real compact event and the line it came from. No download and
      # no Docker, and it is the falsifier for the correctness section of the
      # results file: if the engine changes how it writes a template, this fails
      # here rather than in a table nobody reruns.
      - name: Decode rules (no download, asserts live)
        run: python clickhouse-clickstack/reference_decode.py --self-test

  clickstack-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # The run needs Docker, four containers and a download, so CI checks what
      # it can without them: that the driver and the two helpers still parse.
      - name: Syntax-check the harness
        run: |
          bash -n clickstack-e2e/run.sh
          python -m py_compile clickstack-e2e/report.py clickstack-e2e/patch_engine_config.py

  clickstack-e2e-gaps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Six runs, each needing Docker, five containers and a 215 MB capture, so
      # CI checks what it can without them: that every script and every helper
      # still parses. A gap script that stops parsing stops running, and the
      # results file it writes is the only place its numbers exist.
      - name: Syntax-check the gap scripts
        run: |
          bash -n clickstack-e2e-gaps/lib.sh
          for f in clickstack-e2e-gaps/gap*.sh; do bash -n "$f"; done
          python -m py_compile clickstack-e2e-gaps/*.py

  splunk-license:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # The run needs Docker, a 6.5 GB Splunk image, a 215 MB capture and a
      # licence day to end, so CI checks what it can without any of them.
      - name: Syntax-check the harness
        run: |
          bash -n splunk-license/run.sh
          python -m py_compile splunk-license/*.py

      # The licence figures in the results file are arithmetic over the
      # RolloverSummary lines the run kept verbatim. Recompute them from those
      # lines and fail if the committed results.json disagrees, so a number
      # edited without a rerun is caught here.
      - name: The committed figures follow from the kept rollup lines
        run: python splunk-license/report.py --dir splunk-license --data splunk-license/data --results splunk-license/results --check

      - name: The same check on the 2026-10-10 run
        run: python splunk-license/report.py --dir splunk-license --data splunk-license/data --results splunk-license/results-2026-10-10 --check

  intent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # The run needs Docker, two engine images and both captures, so CI checks
      # what it can without them.
      - name: Syntax-check the harness
        run: |
          bash -n intent/run.sh intent/bench/engine.sh
          python -m py_compile intent/bench/*.py

      # The tables in results.md are rendered from the committed score files.
      # Re-render them and fail if the committed tables disagree, so a number
      # edited without a rerun is caught here.
      - name: The committed tables follow from the committed scores
        run: |
          python intent/bench/summarize.py > /tmp/results.md
          diff -u intent/results/results.md /tmp/results.md

  datadog-flex-accounting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The run needs Docker, the engine image, the MCP server and the capture, so CI
      # checks what it can without them.
      - name: Syntax-check the harness
        run: |
          bash -n datadog-flex-accounting/run.sh accounting-lib/engine.sh
          python -m py_compile datadog-flex-accounting/report.py datadog-flex-accounting/filters.py accounting-lib/policy.py accounting-lib/count.py accounting-lib/tally.py accounting-lib/readme.py accounting-lib/datadog_series.py accounting-lib/datadog_config.py accounting-lib/ddcapture.py
          node --check accounting-lib/plan.mjs

      # Every figure in results.md is arithmetic over the kept tallies, the plan files
      # and prices.json. Recompute and fail if the committed results.json or the README
      # headline disagrees.
      - name: The committed figures follow from the kept tallies
        run: python datadog-flex-accounting/report.py --check

  cloudwatch-ia-accounting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Syntax-check the harness
        run: |
          bash -n cloudwatch-ia-accounting/run.sh accounting-lib/engine.sh
          python -m py_compile cloudwatch-ia-accounting/report.py accounting-lib/policy.py accounting-lib/count.py accounting-lib/tally.py accounting-lib/readme.py

      - name: The committed figures follow from the kept tallies
        run: python cloudwatch-ia-accounting/report.py --check
