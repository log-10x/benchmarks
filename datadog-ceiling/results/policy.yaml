# Log10x recurring cost-reduction policy
# Generated by log10x_setup_recurring: edit and re-commit as needed.
# The CLI reads this file at the start of each tick.
schema_version: "1.0"

reduction:
  # empty = all services
  target_services: []
  # Datadog Standard indexing for the whole account, held month to date.
  # Each run gives the Receiver's services what is left after lines that do not pass it.
  budget_usd_monthly: 10.89
  # the Datadog indexes that bill as Standard (required; the Flex index tenx-offload never counts)
  standard_indexes:
    - main
  # error lines over a limit that pass per statement per node per window
  keep_count: 50
  default_action: tier_down
  # dollars a month of Standard for a named service, held to its own number;
  # the rest of the account is held to budget_usd_monthly minus their sum.
  # Spend is Datadog's usage count under the service tag, the container name
  # unless datadog_service names it.
  service_budgets:
    frontend: 0.88
  nodes_by_container:
    accounting: 1
    ad: 1
    astronomy-db: 1
    cart: 1
    checkout: 1
    currency: 1
    email: 1
    flagd: 1
    flagd-ui: 1
    fraud-detection: 1
    frontend: 1
    frontend-proxy: 1
    image-provider: 1
    kafka: 1
    load-generator: 1
    otel-collector: 1
    payment: 1
    product-catalog: 1
    quote: 1
    recommendation: 1
    shipping: 1
    telemetry-docs: 1
    valkey-cart: 1
  exceptions: []
  min_delta_pp: 2

schedule:
  preset: hourly
  cron_utc: "0 * * * *"
  scheduler: github_actions

config_plane:
  repo: /Users/talweiss/git/l1x-co/wt-bench-ceiling/datadog-ceiling/results/policy-clone
  delivery: gitops
  # the run commits straight to this branch; the engine's gitops pull reads it (GH_BRANCH)
  policy_branch: test/datadog-ceiling-policy

